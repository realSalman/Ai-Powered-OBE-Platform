# Production NGINX Reverse Proxy for AtlasAI
# Full-Stack Containerized Setup

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    gzip on;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_auth_limit:5m rate=20r/s;

    # Upstreams matching Docker Compose service names
    upstream atlasai_backend {
        server backend:5000;
        keepalive 64;
    }

    upstream atlasai_frontend {
        server frontend:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name api.atlasai.local; # Can be updated to your domain

        limit_req_status 429;

        # 1. API Authentication Routes (Stricter Limits)
        location /api/v1/auth/ {
            limit_req zone=api_auth_limit burst=50 nodelay;

            proxy_pass http://atlasai_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. General API Routes
        location /api/ {
            limit_req zone=api_general_limit burst=200 nodelay;

            proxy_pass http://atlasai_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }

        # 3. Next.js Frontend (All other routes)
        location / {
            limit_req zone=api_general_limit burst=200 nodelay;

            proxy_pass http://atlasai_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
