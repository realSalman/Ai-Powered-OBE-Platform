version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: atlasai-nginx
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: atlasai-frontend
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: atlasai-backend
    environment:
      - NODE_ENV=production
      # Replace with your actual MongoDB Atlas connection string
      - MONGO_URI=mongodb+srv://<username>:<password>@<cluster-url>/atlasai?retryWrites=true&w=majority
      - REDIS_URL=redis://redis:6379
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/serviceAccountKey.json
      # Add other environment variables as needed or use an env_file
    volumes:
      # Mount the firebase credentials to the backend container
      - ./server/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      - redis
    restart: unless-stopped


  redis:
    image: redis:alpine
    container_name: atlasai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
